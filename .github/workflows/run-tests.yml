name: Run unit and integration tests

on:
  pull_request:
    types: [opened, synchronize]
    branches: ['master']
    paths: ['cls/**/*.cls', 'tests/**/*.cls']

jobs:
  run_tests:
    runs-on: ubuntu-latest
    name: Run tests
    steps:
      - name: Clone this repository
        uses: actions/checkout@v2
        with:
          path: app
      - name: Install dos2unix
        run: |
          sudo apt-get update
          sudo apt-get install -y dos2unix
      - name: Convert line endings to LF (Unix format)
        run: find . -type f -exec dos2unix {} \;
      - name: Strip ROUTINE marks
        run: app/bin/strip-atelier-headers.sh app
      - name: Back-compatibilize with Cache
        run: app/bin/iris-bc.sh app
      # Pinned back to v0.6.5 (2025 build). The floating iris2026 tag — and
      # every other tag from that same release (v0.6.6, v0.7.0, latest,
      # *-iris2026) — is listed in the GHCR tag list but 404s when the
      # manifest is actually fetched: a ghost tag pointing at content that no
      # longer exists in the registry. Confirmed against the registry API
      # directly, not just this workflow. v0.6.5 is the newest tag that still
      # resolves. Revert to iris2026 once rfns/iris-ci republishes a working
      # 2026 image.
      - name: Import classes and run tests
        run: |
          docker run --rm -t --name test-ci \
          -e TEST_SUITE="tests" \
          -e TEST_AUTOLOAD_DIR="_setup" \
          -v $PWD/app:/opt/ci/app ghcr.io/rfns/iris-ci/iris-ci:v0.6.5

