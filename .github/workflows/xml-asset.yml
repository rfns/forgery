name: Create XML release assets

on:
  release:
    types: [published]
  # Lets a release be rebuilt without cutting a new tag, which is what the next
  # expired base image will call for.
  workflow_dispatch:
    inputs:
      version:
        description: "Existing tag to build the assets from"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    name: Export and attach the XML assets
    steps:
      - name: Clone this repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref_name }}

      - name: Resolve the version
        id: metadata
        run: echo "VERSION=${{ inputs.version || github.ref_name }}" >> $GITHUB_OUTPUT

      # Produces both flavours: one for IRIS and one for Caché, the latter from
      # sources that bin/iris-bc.sh rewrote. See the script for why a single
      # artifact cannot serve both.
      - name: Export the XML assets
        run: bin/export-xml.sh "${{ steps.metadata.outputs.VERSION }}" dist

      - name: Attach the assets to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.metadata.outputs.VERSION }}
          files: |
            dist/forgery-${{ steps.metadata.outputs.VERSION }}-iris.xml
            dist/forgery-${{ steps.metadata.outputs.VERSION }}-iris.sha1
            dist/forgery-${{ steps.metadata.outputs.VERSION }}.xml
            dist/forgery-${{ steps.metadata.outputs.VERSION }}.sha1
